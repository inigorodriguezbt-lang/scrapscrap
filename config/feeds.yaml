# Wire sources. Every feed here was fetched and parsed successfully, with its
# newest item timestamped, before being added. Re-verify with:
#   python -m pipeline.wire --check
#
# tier drives how the writer attributes a claim (see style/04-attribution.md):
#   primary    - the organisation speaking about itself
#   press      - a newsroom with bylined reporters
#   commentary - analysis and independent writers
# weight biases story ranking.
# ai_only keeps only items whose title or summary names an AI term (the list
# in config/discover.yaml), for general tech feeds.

feeds:
  # ── press ────────────────────────────────────────────────────────────────
  - { name: TechCrunch AI,   url: "https://techcrunch.com/category/artificial-intelligence/feed/", tier: press, weight: 1.2 }
  - { name: The Verge AI,    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", tier: press, weight: 1.2 }
  - { name: Ars Technica,    url: "https://feeds.arstechnica.com/arstechnica/technology-lab", tier: press, weight: 1.3 }
  - { name: MIT Tech Review, url: "https://www.technologyreview.com/feed/", tier: press, weight: 1.3 }
  - { name: The Decoder,     url: "https://the-decoder.com/feed/", tier: press, weight: 1.2 }
  - { name: Ars Technica AI, url: "https://arstechnica.com/ai/feed/", tier: press, weight: 1.3 }
  - { name: Wired AI,        url: "https://www.wired.com/feed/tag/ai/latest/rss", tier: press, weight: 1.2 }
  - { name: 404 Media,       url: "https://www.404media.co/rss/", tier: press, weight: 1.2, ai_only: true }
  - { name: Engadget,        url: "https://www.engadget.com/rss.xml", tier: press, weight: 1.0, ai_only: true }
  - { name: Bloomberg Tech,  url: "https://feeds.bloomberg.com/technology/news.rss", tier: press, weight: 1.3, ai_only: true }
  - { name: Tom's Hardware,  url: "https://www.tomshardware.com/feeds/all", tier: press, weight: 1.0, ai_only: true }
  - { name: UploadVR,        url: "https://www.uploadvr.com/rss/", tier: press, weight: 1.0, ai_only: true }
  - { name: 9to5Google,      url: "https://9to5google.com/feed/", tier: press, weight: 1.0, ai_only: true }
  - { name: 9to5Mac,         url: "https://9to5mac.com/feed/", tier: press, weight: 1.0, ai_only: true }
  - { name: The Register AI, url: "https://www.theregister.com/software/ai_ml/headlines.atom", tier: press, weight: 1.1 }
  - { name: The Robot Report, url: "https://www.therobotreport.com/feed/", tier: press, weight: 1.1 }

  # ── primary: organisations announcing their own work ─────────────────────
  - { name: OpenAI,          url: "https://openai.com/blog/rss.xml", tier: primary, weight: 1.6 }
  - { name: Google AI,       url: "https://blog.google/technology/ai/rss/", tier: primary, weight: 1.5 }
  - { name: DeepMind,        url: "https://deepmind.google/blog/rss.xml", tier: primary, weight: 1.5 }
  - { name: Hugging Face,    url: "https://huggingface.co/blog/feed.xml", tier: primary, weight: 1.3 }
  - { name: NVIDIA,          url: "https://blogs.nvidia.com/feed/", tier: primary, weight: 1.3 }
  - { name: AWS ML,          url: "https://aws.amazon.com/blogs/machine-learning/feed/", tier: primary, weight: 1.1 }
  - { name: NVIDIA Developer, url: "https://developer.nvidia.com/blog/feed/", tier: primary, weight: 1.2 }
  - { name: Mistral,         url: "https://mistral.ai/rss.xml", tier: primary, weight: 1.4 }
  - { name: Google Research, url: "https://research.google/blog/rss/", tier: primary, weight: 1.3 }
  - { name: Apple ML,        url: "https://machinelearning.apple.com/rss.xml", tier: primary, weight: 1.2 }
  - { name: Ollama,          url: "https://ollama.com/blog/rss.xml", tier: primary, weight: 1.1 }
  - { name: GitHub Blog,     url: "https://github.blog/feed/", tier: primary, weight: 1.1, ai_only: true }
  # Launches people can try today. The maker's own listing, so primary, but
  # light: a listing is a claim, not coverage.
  - { name: Product Hunt AI, url: "https://www.producthunt.com/feed?category=artificial-intelligence", tier: primary, weight: 0.8 }

  # ── commentary ───────────────────────────────────────────────────────────
  - { name: Simon Willison,  url: "https://simonwillison.net/atom/everything/", tier: commentary, weight: 1.3 }
  - { name: Stratechery,     url: "https://stratechery.com/feed/", tier: commentary, weight: 1.2 }
  - { name: Import AI,       url: "https://importai.substack.com/feed", tier: commentary, weight: 1.1 }
  - { name: Latent Space,    url: "https://www.latent.space/feed", tier: commentary, weight: 1.1 }
  - { name: Interconnects,   url: "https://www.interconnects.ai/feed", tier: commentary, weight: 1.1 }
  - { name: SemiAnalysis,    url: "https://www.semianalysis.com/feed", tier: commentary, weight: 1.2 }
  - { name: Lobsters AI,     url: "https://lobste.rs/t/ai.rss", tier: commentary, weight: 0.9 }

# Checked and rejected, so nobody re-adds them:
#   VentureBeat AI   - HTTPError on fetch
#   Meta AI blog     - 404
#   Microsoft AI     - 410 Gone
#   arxiv rss.arxiv.org - parses but yields zero items; use the API block below

# arXiv has no working RSS, but its Atom API does work.
arxiv:
  enabled: true
  categories: [cs.AI, cs.CL, cs.LG]
  max_results: 25
  weight: 1.0
  tier: primary
