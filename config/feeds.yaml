# Wire sources. Every feed here was fetched and parsed successfully, with its
# newest item timestamped, before being added. Re-verify with:
#   python -m pipeline.wire --check
#
# tier drives how the writer attributes a claim (see style/04-attribution.md):
#   primary    - the organisation speaking about itself
#   press      - a newsroom with bylined reporters
#   commentary - analysis and independent writers
# weight biases story ranking.

feeds:
  # ── press ────────────────────────────────────────────────────────────────
  - { name: TechCrunch AI,   url: "https://techcrunch.com/category/artificial-intelligence/feed/", tier: press, weight: 1.2 }
  - { name: The Verge AI,    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", tier: press, weight: 1.2 }
  - { name: Ars Technica,    url: "https://feeds.arstechnica.com/arstechnica/technology-lab", tier: press, weight: 1.3 }
  - { name: MIT Tech Review, url: "https://www.technologyreview.com/feed/", tier: press, weight: 1.3 }

  # ── primary: organisations announcing their own work ─────────────────────
  - { name: OpenAI,          url: "https://openai.com/blog/rss.xml", tier: primary, weight: 1.6 }
  - { name: Google AI,       url: "https://blog.google/technology/ai/rss/", tier: primary, weight: 1.5 }
  - { name: DeepMind,        url: "https://deepmind.google/blog/rss.xml", tier: primary, weight: 1.5 }
  - { name: Hugging Face,    url: "https://huggingface.co/blog/feed.xml", tier: primary, weight: 1.3 }
  - { name: NVIDIA,          url: "https://blogs.nvidia.com/feed/", tier: primary, weight: 1.3 }
  - { name: AWS ML,          url: "https://aws.amazon.com/blogs/machine-learning/feed/", tier: primary, weight: 1.1 }

  # ── commentary ───────────────────────────────────────────────────────────
  - { name: Simon Willison,  url: "https://simonwillison.net/atom/everything/", tier: commentary, weight: 1.3 }
  - { name: Stratechery,     url: "https://stratechery.com/feed/", tier: commentary, weight: 1.2 }
  - { name: Import AI,       url: "https://importai.substack.com/feed", tier: commentary, weight: 1.1 }

# Checked and rejected, so nobody re-adds them:
#   VentureBeat AI   - HTTPError on fetch
#   Meta AI blog     - 404
#   Microsoft AI     - 410 Gone
#   arxiv rss.arxiv.org - parses but yields zero items; use the API block below

# arXiv has no working RSS, but its Atom API does work.
arxiv:
  enabled: true
  categories: [cs.AI, cs.CL, cs.LG]
  max_results: 25
  weight: 1.0
  tier: primary
