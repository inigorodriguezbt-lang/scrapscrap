name: Publish edition

# Runs on GitHub's infrastructure, not your machine. Secrets live in
# GitHub Secrets, which is real secret storage -- Claude Code web's
# environment-variables field is explicitly not (it warns against
# credentials), which is why the schedule lives here.
on:
  schedule:
    - cron: "5 */2 * * *"     # every two hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Base wire: free, breaches nobody's terms, needs no key.
      - name: Collect the wire
        run: python -m pipeline.wire --hours 24

      # Optional. Skipped entirely when no key is set, so the edition
      # still ships without a paid provider.
      - name: Search X for corroboration
        if: ${{ secrets.XQUIK_API_KEY != '' }}
        env:
          XQUIK_API_KEY: ${{ secrets.XQUIK_API_KEY }}
          X_PROVIDER: xquik
        run: |
          python -m pipeline.xsearch --check
          # Narrow queries only -- every returned row is billed.
          python -m pipeline.xsearch \
            --query "(OpenAI OR Anthropic OR Nvidia) (launch OR release OR raises) -filter:replies" \
            --limit 100 --out data/raw/x-$(date -u +%Y%m%dT%H%M%SZ).jsonl

      - name: Declare stories
        run: python -m pipeline.cluster

      - name: Write the edition
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/write-edition"
          claude_args: "--allowedTools Read,Write,Edit,Bash(python -m pipeline.build),Bash(python -m pipeline.stylecheck)"

      - name: Check house style
        run: python -m pipeline.stylecheck data/editions/$(date -u +%Y-%m-%d).json

      - name: Render the site
        run: python -m pipeline.build

      - name: Commit the issue
        run: |
          git config user.name  "the-desk"
          git config user.email "noreply@users.noreply.github.com"
          git add data/briefs data/editions
          git diff --staged --quiet || git commit -m "Edition of $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
