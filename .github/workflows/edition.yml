name: Publish edition

# HuggingNews runs its pipeline every two hours; this matches that cadence.
on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # The account pool lives in a secret, not the repo. See README.
      - name: Restore scraper accounts
        env:
          TWSCRAPE_ACCOUNTS_DB: ${{ secrets.TWSCRAPE_ACCOUNTS_DB }}
        run: |
          if [ -z "$TWSCRAPE_ACCOUNTS_DB" ]; then
            echo "::error::TWSCRAPE_ACCOUNTS_DB secret is not set; see README."
            exit 1
          fi
          echo "$TWSCRAPE_ACCOUNTS_DB" | base64 -d > accounts.db

      - name: Collect the wire
        run: python -m pipeline.scrape --hours 24 --limit 60

      - name: Declare stories
        run: python -m pipeline.cluster

      # The newsroom. Claude reads the brief and writes the copy.
      - name: Write the edition
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/write-edition"
          claude_args: "--allowedTools Read,Write,Edit,Bash(python -m pipeline.build)"

      - name: Render the site
        run: python -m pipeline.build

      - name: Commit the issue
        run: |
          git config user.name  "the-desk"
          git config user.email "noreply@users.noreply.github.com"
          git add data/briefs data/editions
          git diff --staged --quiet || git commit -m "Edition of $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
