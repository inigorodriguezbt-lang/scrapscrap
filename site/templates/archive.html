{% extends "base.html" %}
{% block title %}Archive · {{ paper.name }}{% endblock %}
{% block content %}
<section class="band" style="border-top:0;margin-top:26px">
  <div class="band__head">Back Issues</div>
  {% for issue in issues %}
  <div style="padding:15px 0;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:16px">
    <a href="{{ rel }}issue/{{ issue.date }}/" class="hed" style="font-size:21px">{{ issue.date_long }}</a>
    <span style="font-family:var(--label);color:var(--ink-3);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap">{{ issue.count }} stories</span>
  </div>
  {% endfor %}
</section>
{% endblock %}
