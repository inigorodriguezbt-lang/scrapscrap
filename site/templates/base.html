<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ paper.name }} · {{ paper.tagline }}{% endblock %}</title>
<meta name="description" content="{{ page_description|default(paper.tagline, true) }}">
<link rel="canonical" href="{{ site_url }}/{{ page_path|default('', true) }}">
<link rel="alternate" type="application/atom+xml" title="{{ paper.name }}" href="{{ rel }}feed.xml">

<!-- Link previews. Without these a shared story renders as a bare URL. -->
<meta property="og:site_name" content="{{ paper.name }}">
<meta property="og:type" content="{{ page_type|default('website', true) }}">
<meta property="og:title" content="{{ page_title|default(paper.name, true) }}">
<meta property="og:description" content="{{ page_description|default(paper.tagline, true) }}">
<meta property="og:url" content="{{ site_url }}/{{ page_path|default('', true) }}">
<meta property="og:image" content="{{ site_url }}/assets/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title|default(paper.name, true) }}">
<meta name="twitter:description" content="{{ page_description|default(paper.tagline, true) }}">
<meta name="twitter:image" content="{{ site_url }}/assets/social-card.png">
<link rel="icon" href="{{ rel }}assets/monogram.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ rel }}style.css?v={{ css_version }}">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <a href="{{ rel }}" class="masthead__name">{{ paper.name }}</a>
  </header>

  <nav class="nav">
    <a href="{{ rel }}"{% if not current_section %} aria-current="page"{% endif %}>Front Page</a>
    {% for section in sections %}
    <a href="{{ rel }}section/{{ section.slug }}/"{% if current_section == section.slug %} aria-current="page"{% endif %}>{{ section.name }}</a>
    {% endfor %}
    <a href="{{ rel }}archive/">Archive</a>
  </nav>

  {% if topics %}
  <div class="topics">
    {% for topic in topics %}<a href="{{ rel }}#{{ topic.slug }}">{{ topic.name }}</a>{% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}

</div>
</body>
</html>
