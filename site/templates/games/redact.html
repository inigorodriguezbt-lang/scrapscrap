{% extends "games/_game.html" %}
{% block rules %}A headline from this paper with three words blacked out. Guess a word at a time. <b>Six misses and it's gone.</b>{% endblock %}
{% block script %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var G = Games, el = G.el, root = document.getElementById("root"), rel = document.getElementById("game").dataset.rel;
  var MAX = 6;
  document.getElementById("num").textContent = G.number();
  G.fetchJSON(rel + "assets/games/redact.json").then(function (d) {
    var p = G.pick(d.puzzles, G.day());
    var s = G.state("redact") || G.setState("redact", { solved: [], misses: [], log: [] });
    document.getElementById("meta-right").textContent = "3 words · 6 misses";
    render();

    function norm(w) { return (w || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
    function headline(reveal) {
      return el("div", { class: "words" }, p.words.map(function (w, i) {
        var isBlank = p.blanks.indexOf(i) >= 0;
        if (!isBlank) return el("span", null, [w + " "]);
        var solved = s.solved.indexOf(i) >= 0;
        if (solved || reveal) return el("span", { class: solved ? "blank--solved" : "" }, [w + " "]);
        var n = p.answers[String(i)].length;
        var boxes = []; for (var k = 0; k < n; k++) boxes.push(el("i"));
        return el("span", null, [el("span", { class: "blank", "aria-label": n + " letters" }, boxes), " "]);
      }));
    }
    function dots() {
      var out = [];
      for (var k = 0; k < MAX; k++) out.push(el("div", { class: "dot" + (k < s.misses.length ? " dot--miss" : "") }));
      return el("div", { class: "dots" }, out);
    }
    function render() {
      root.innerHTML = "";
      if (s.solved.length === p.blanks.length || s.misses.length >= MAX) return finish();
      root.appendChild(headline(false));
      root.appendChild(dots());
      var input = el("input", { type: "text", placeholder: "A word", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Your guess" });
      var form = el("form", { class: "field", onsubmit: function (e) { e.preventDefault(); guess(input.value); input.value = ""; } }, [
        input, el("button", { class: "btn", type: "submit" }, ["Guess"])
      ]);
      root.appendChild(form);
      if (s.misses.length) root.appendChild(el("p", { class: "note" }, ["Missed: " + s.misses.join(", ")]));
      root.appendChild(el("p", { class: "note" }, ["Clue: it ran in ", el("a", { href: rel + "archive/" }, ["this paper"]), ", recently."]));
      input.focus();
    }
    function guess(raw) {
      var g = norm(raw);
      if (!g) return;
      if (s.misses.indexOf(g) >= 0) { G.toast("Already tried"); return; }
      var hit = null;
      p.blanks.forEach(function (i) {
        if (s.solved.indexOf(i) >= 0 || hit !== null) return;
        var a = p.answers[String(i)];
        if (g === a || g + "s" === a || g === a + "s") hit = i;
      });
      if (hit !== null) { s.solved.push(hit); s.log.push("r"); }
      else { s.misses.push(g); s.log.push("m"); }
      G.setState("redact", s);
      render();
    }
    function finish() {
      var won = s.solved.length === p.blanks.length;
      var st = G.record("redact", won);
      var grid = s.log.map(function (x) { return x === "r" ? "🟦" : "⬛"; }).join("");
      root.appendChild(headline(true));
      root.appendChild(G.resultPanel({
        title: won ? "Unredacted in " + s.log.length + (s.log.length === 3 ? " guesses. Clean." : " guesses.") : "Classified. The story is below.",
        lines: [grid], stats: st,
        shareText: "Redact #" + G.number() + " · " + (won ? s.log.length + " guesses" : "X") + "\n" + grid + "\n" + G.SITE + "/games/redact/",
        extra: el("p", null, [el("a", { href: rel + p.url }, ["Read the story →"])])
      }));
    }
  });
});
</script>
{% endblock %}
