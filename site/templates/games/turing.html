{% extends "games/_game.html" %}
{% block rules %}Five passages. Some were written by a person, some by a machine. Say which. <b>One try each.</b>{% endblock %}
{% block script %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var G = Games, el = G.el, root = document.getElementById("root"), rel = document.getElementById("game").dataset.rel;
  document.getElementById("num").textContent = G.number();
  G.fetchJSON(rel + "assets/games/turing.json").then(function (d) {
    var puzzle = G.pick(d.days, G.day());
    var s = G.state("turing") || G.setState("turing", { answers: [] });
    document.getElementById("meta-right").textContent = "5 passages";
    render();

    function dots(pending) {
      return el("div", { class: "dots" }, puzzle.items.map(function (_, i) {
        var a = s.answers[i];
        return el("div", { class: "dot" + (a === undefined ? "" : a.right ? " dot--right" : " dot--miss") });
      }));
    }
    function render() {
      root.innerHTML = "";
      var i = s.answers.length;
      if (i >= puzzle.items.length) return finish();
      var it = puzzle.items[i];
      root.appendChild(dots());
      root.appendChild(el("div", { class: "card" }, [el("p", { class: "card__text" }, [it.text])]));
      root.appendChild(el("div", { class: "row" }, [
        el("button", { class: "btn btn--ghost", onclick: function () { answer("human"); } }, ["Human"]),
        el("button", { class: "btn btn--ghost", onclick: function () { answer("machine"); } }, ["Machine"])
      ]));
    }
    function answer(choice) {
      var i = s.answers.length, it = puzzle.items[i], right = choice === it.by;
      s.answers.push({ choice: choice, right: right }); G.setState("turing", s);
      root.innerHTML = "";
      root.appendChild(dots());
      root.appendChild(el("div", { class: "card " + (right ? "card--right" : "card--wrong") }, [
        el("p", { class: "card__text" }, [it.text]),
        el("div", { class: "card__meta" }, [(right ? "Right. " : "No. ") + (it.by === "human" ? "Human — " : "Machine — ") + it.who])
      ]));
      root.appendChild(el("button", { class: "btn btn--wide", onclick: render }, [i + 1 < puzzle.items.length ? "Next" : "See result"]));
    }
    function finish() {
      var score = s.answers.filter(function (a) { return a.right; }).length;
      var won = score >= 4;
      var st = G.record("turing", won);
      var grid = s.answers.map(function (a) { return a.right ? "🟦" : "⬛"; }).join("");
      var titles = ["Fooled five times.", "One in five.", "Two in five.", "Three in five.", "Four in five.", "Perfect. You can tell."];
      root.appendChild(G.resultPanel({
        title: titles[score], lines: [grid], stats: st,
        shareText: "Turing #" + G.number() + " · " + score + "/5\n" + grid + "\n" + G.SITE + "/games/turing/",
        extra: el("p", null, ["Four or more keeps the streak. The human lines are in the public domain; the machine lines were written for this puzzle by a language model."])
      }));
    }
  });
});
</script>
{% endblock %}
