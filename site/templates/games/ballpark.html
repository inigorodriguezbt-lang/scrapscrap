{% extends "games/_game.html" %}
{% block rules %}A number from today's news. Guess it. After each try you learn higher or lower, and how far off you are. <b>Within 10% counts. Five tries.</b>{% endblock %}
{% block script %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var G = Games, el = G.el, root = document.getElementById("root"), rel = document.getElementById("game").dataset.rel;
  var MAX = 5;
  document.getElementById("num").textContent = G.number();
  G.fetchJSON(rel + "assets/games/ballpark.json").then(function (d) {
    var p = G.pick(d.puzzles, G.day());
    var s = G.state("ballpark") || G.setState("ballpark", { guesses: [] });
    document.getElementById("meta-right").textContent = "5 tries";
    render();

    function fmt(n) { return Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 }); }
    function judge(g) {
      var ratio = Math.max(g / p.a, p.a / g);
      if (!isFinite(ratio) || g <= 0) ratio = Infinity;
      var hit = ratio <= 1.1;
      var dir = g < p.a ? "Higher" : "Lower";
      var heat = hit ? "hit" : ratio <= 2 ? "close" : ratio <= 10 ? "far" : "cold";
      var words = { hit: "In the ballpark", close: dir + ", and you're close", far: dir + ", by some way", cold: dir + ", by an order of magnitude or more" };
      return { hit: hit, heat: heat, text: words[heat] };
    }
    function emoji(v) { return v.hit ? "🟦" : v.heat === "close" ? "⬜" : "⬛"; }
    function log() {
      return el("div", { class: "log" }, s.guesses.map(function (g) {
        var v = judge(g);
        return el("div", { class: "log__row" + (v.hit ? " log__row--hit" : "") }, [
          el("span", { class: "log__guess" }, [fmt(g) + " " + p.unit]),
          el("span", { class: "log__verdict" }, [v.text])
        ]);
      }));
    }
    function render() {
      root.innerHTML = "";
      var last = s.guesses.length ? judge(s.guesses[s.guesses.length - 1]) : null;
      if ((last && last.hit) || s.guesses.length >= MAX) return finish();
      root.appendChild(el("div", { class: "card" }, [el("p", { class: "card__text" }, [p.q])]));
      var input = el("input", { type: "number", step: "any", inputmode: "decimal", placeholder: "Your number", "aria-label": "Your guess" });
      root.appendChild(el("form", { class: "field", onsubmit: function (e) { e.preventDefault(); guess(input.value); } }, [
        input, el("span", { class: "unit" }, [p.unit]), el("button", { class: "btn", type: "submit" }, ["Guess"])
      ]));
      root.appendChild(el("p", { class: "note" }, [(MAX - s.guesses.length) + " of 5 tries left"]));
      root.appendChild(log());
      input.focus();
    }
    function guess(v) {
      var g = parseFloat(v);
      if (!(g > 0)) { G.toast("A number above zero"); return; }
      s.guesses.push(g); G.setState("ballpark", s); render();
    }
    function finish() {
      var won = s.guesses.some(function (g) { return judge(g).hit; });
      var st = G.record("ballpark", won);
      var grid = s.guesses.map(function (g) { return emoji(judge(g)); }).join("");
      root.appendChild(el("div", { class: "card card--right" }, [
        el("p", { class: "card__text" }, [p.q]),
        el("div", { class: "card__meta" }, ["Answer: " + fmt(p.a) + " " + p.unit])
      ]));
      root.appendChild(G.resultPanel({
        title: won ? "Ballpark in " + s.guesses.length + (s.guesses.length === 1 ? " try." : " tries.") : "Out of the park. Answer above.",
        lines: [grid], stats: st,
        shareText: "Ballpark #" + G.number() + " · " + (won ? s.guesses.length + "/5" : "X/5") + "\n" + grid + "\n" + G.SITE + "/games/ballpark/",
        extra: el("p", null, [el("a", { href: rel + "story/" + p.story + "/" }, ["The story behind the number →"])])
      }));
    }
  });
});
</script>
{% endblock %}
