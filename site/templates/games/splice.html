{% extends "games/_game.html" %}
{% block rules %}Two of this paper's headlines, joined at a seam. Tap the last word of the first one. <b>Three rounds.</b>{% endblock %}
{% block script %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var G = Games, el = G.el, root = document.getElementById("root"), rel = document.getElementById("game").dataset.rel;
  document.getElementById("num").textContent = G.number();
  G.fetchJSON(rel + "assets/games/splice.json").then(function (d) {
    var rounds = G.shuffle(d.pool, G.day() * 13 + 1).slice(0, 3);
    var s = G.state("splice") || G.setState("splice", { picks: [] });
    document.getElementById("meta-right").textContent = "3 rounds";
    render();

    function dots() {
      return el("div", { class: "dots" }, rounds.map(function (r, i) {
        var p = s.picks[i];
        return el("div", { class: "dot" + (p === undefined ? "" : p === r.seam ? " dot--right" : " dot--miss") });
      }));
    }
    function render() {
      root.innerHTML = "";
      var i = s.picks.length;
      if (i >= rounds.length) return finish();
      var r = rounds[i];
      root.appendChild(dots());
      root.appendChild(el("div", { class: "words" }, r.words.map(function (w, k) {
        return el("span", { class: "word", role: "button", tabindex: "0", onclick: function () { pick(k); },
                            onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(k); } } }, [w, " "]);
      })));
      root.appendChild(el("p", { class: "note" }, ["Round " + (i + 1) + " of 3"]));
    }
    function pick(k) {
      var i = s.picks.length, r = rounds[i];
      s.picks.push(k); G.setState("splice", s);
      var right = k === r.seam;
      root.innerHTML = "";
      root.appendChild(dots());
      root.appendChild(el("div", { class: "words" }, r.words.map(function (w, j) {
        var cls = "word" + (j === r.seam ? " word--seam" : "") + (j > r.seam ? " word--after" : "") + (j === k && !right ? " word--picked" : "");
        return el("span", { class: cls }, [w, " "]);
      })));
      root.appendChild(el("p", { class: "note" }, [
        right ? "Right. " : "No — the seam is after the blue word. ",
        el("a", { href: rel + r.a.url }, [r.a.headline]), " + ", el("a", { href: rel + r.b.url }, [r.b.headline])
      ]));
      root.appendChild(el("button", { class: "btn btn--wide", onclick: render }, [i + 1 < rounds.length ? "Next" : "See result"]));
    }
    function finish() {
      var score = s.picks.filter(function (p, i) { return p === rounds[i].seam; }).length;
      var won = score === 3;
      var st = G.record("splice", won);
      var grid = s.picks.map(function (p, i) { return p === rounds[i].seam ? "🟦" : "⬛"; }).join("");
      root.appendChild(G.resultPanel({
        title: ["No seams found.", "One seam.", "Two seams.", "All three. Sharp eyes."][score], lines: [grid], stats: st,
        shareText: "Splice #" + G.number() + " · " + score + "/3\n" + grid + "\n" + G.SITE + "/games/splice/",
        extra: el("p", null, ["Three of three keeps the streak."])
      }));
    }
  });
});
</script>
{% endblock %}
